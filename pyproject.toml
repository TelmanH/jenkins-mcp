[build-system]
requires = ["setuptools>=84.2.1"]   # SPDX license expression (PEP 639)
build-backend = "setuptools.build_meta"

[project]
name = "jenkins-mcp"
version = "1.0.0"
description = "Read-only, multi-instance Jenkins MCP server with server-side log analysis and a team knowledge base"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Telman Huseynli" }]
requires-python = ">=3.10"
keywords = ["jenkins", "mcp", "model-context-protocol", "ci", "build-logs", "copilot", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "fastmcp>=4.1.4,<5",         # 4.x runs sync tools in worker threads (blocking HTTP does not stall the server)
    "requests>=2.34.2",
    "python-dotenv>=1.0",
    "PyYAML>=6.0.3",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "pytest-asyncio>=1.4.0", "pytest-cov>=5", "responses>=0.26.3", "mypy>=1.10", "types-PyYAML", "types-requests"]

[project.scripts]
jenkins-mcp = "jenkins_mcp.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jenkins_mcp = ["rules/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["live", "mac", "fixtures"]   # tests/live is a standalone script (needs Docker)
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "module"
asyncio_default_test_loop_scope = "module"
